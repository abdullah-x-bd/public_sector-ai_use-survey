name: One-off survey E2E test

on:
  push:
    paths:
      - '.github/workflows/e2e-survey-test.yml'

jobs:
  submit-test-response:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Submit one response through the live GitHub Pages survey
        env:
          SURVEY_URL: https://abdullah-x-bd.github.io/public_sector-ai_use-survey/
          COLLECTOR_URL: https://script.google.com/macros/s/AKfycbxgcXe47MryQeBD0vZujshKARzOarTdhUtneiOdnWQ9OrGcjKVYlSEpY43fJinFEOfmvg/exec
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            const health = await page.request.get(process.env.COLLECTOR_URL);
            const healthText = await health.text();
            console.log('COLLECTOR_HEALTH=' + healthText);
            let healthJson;
            try { healthJson = JSON.parse(healthText); } catch (_) {}
            if (!healthJson || healthJson.survey_version !== '3.0.0' || healthJson.response_sheet !== 'responses_v3') {
              throw new Error('Deployed Apps Script is not V3.0.0 / responses_v3');
            }

            await page.goto(process.env.SURVEY_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('input[name="consent"][value="yes"]').check({ force: true });
            await page.locator('#beginBtn').click();

            await page.locator('#genai').selectOption({ label: 'Daily or almost daily' });
            await page.locator('#benefit').selectOption({ label: 'No' });
            await page.locator('#demoNext').click();
            await page.locator('#startChoices').click();

            for (let i = 0; i < 8; i++) {
              await page.locator('input[name="choice"][value="A"]').check({ force: true });
              await page.locator('#taskNext').click();
            }

            await page.locator('#priority').selectOption({ label: 'Accuracy of the AI system' });
            await page.locator('input[name="accept_ai"][value="3"]').check({ force: true });
            await page.locator('input[name="accept_human"][value="4"]').check({ force: true });
            await page.locator('input[name="confidence"][value="5"]').check({ force: true });
            await page.locator('#open_text').fill('E2E TEST RESPONSE - REMOVE BEFORE ANALYSIS');
            await page.locator('#reviewBtn').click();
            await page.locator('#submitBtn').click();
            await page.locator('.thanks').waitFor({ state: 'visible', timeout: 30000 });

            const body = await page.locator('body').innerText();
            const match = body.match(/Response ID:\s*([0-9a-f-]{20,})/i);
            if (!match) throw new Error('Could not recover response ID from completion page');
            console.log('TEST_RESPONSE_ID=' + match[1]);

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
