name: Cancel blocked persona run

on:
  push:
    paths:
      - '.github/workflows/cancel-stuck-persona-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel blocked run 33288514726
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/33288514726/cancel
